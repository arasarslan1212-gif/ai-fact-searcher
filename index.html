<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ArasBot v2</title>

<style>
/* =========================
   RESET + BASE
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #0b1220, #05070d);
  color: #e8eefc;
  display: flex;
}

/* =========================
   APP LAYOUT
========================= */
#app {
  display: flex;
  width: 100%;
  height: 100%;
}

/* =========================
   SIDEBAR
========================= */
#sidebar {
  width: 280px;
  background: rgba(255,255,255,0.03);
  border-right: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.title {
  font-size: 18px;
  font-weight: 700;
  color: #60a5fa;
}

.small {
  font-size: 12px;
  opacity: 0.6;
  line-height: 1.4;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 10px;
}

button {
  background: #3b82f6;
  border: none;
  color: white;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

/* =========================
   CHAT AREA
========================= */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* HEADER */
#header {
  padding: 14px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02);
}

#status {
  font-size: 12px;
  opacity: 0.7;
}

/* MESSAGES */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 75%;
  padding: 10px 12px;
  border-radius: 12px;
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
}

.user {
  align-self: flex-end;
  background: #1f2937;
  border: 1px solid rgba(255,255,255,0.08);
}

.bot {
  align-self: flex-start;
  background: rgba(59,130,246,0.12);
  border: 1px solid rgba(59,130,246,0.2);
}

/* typing */
.typing {
  display: flex;
  gap: 4px;
  padding: 10px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #60a5fa;
  animation: bounce 1s infinite;
}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}

@keyframes bounce {
  0%,100%{transform:translateY(0);opacity:0.3}
  50%{transform:translateY(-4px);opacity:1}
}

/* INPUT */
#inputBar {
  display: flex;
  padding: 12px;
  border-top: 1px solid rgba(255,255,255,0.08);
  gap: 10px;
}

textarea {
  flex: 1;
  resize: none;
  border-radius: 10px;
  padding: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.03);
  color: white;
  outline: none;
  max-height: 120px;
}

</style>
</head>

<body>

<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="title">ArasBot v2</div>
    <div class="small">
      Local AI running in your browser using Phi-3 Mini.
      No server. No API. Everything stays on your device.
    </div>

    <div class="card">
      <div class="small"><b>Status:</b> <span id="status">Offline</span></div>
    </div>

    <button onclick="boot()">Load Model</button>
    <button onclick="clearChat()">Clear Chat</button>

    <div class="card">
      <div class="small"><b>Memory</b></div>
      <div id="memory" class="small">Nothing yet.</div>
    </div>

  </div>

  <!-- MAIN -->
  <div id="main">

    <div id="header">
      <div><b>Chat</b></div>
      <div id="statusText">Not loaded</div>
    </div>

    <div id="messages"></div>

    <div id="inputBar">
      <textarea id="input" placeholder="Ask something..." rows="1"></textarea>
      <button onclick="send()">Send</button>
    </div>

  </div>

</div>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js";

env.allowLocalModels = false;

let ai = null;
let busy = false;

let memory = JSON.parse(localStorage.getItem("memory") || '{"name":null,"topics":[]}');
let history = JSON.parse(localStorage.getItem("history") || "[]");

const messages = document.getElementById("messages");

function save() {
  localStorage.setItem("memory", JSON.stringify(memory));
  localStorage.setItem("history", JSON.stringify(history.slice(-20)));
}

/* =====================
   MEMORY
===================== */
function updateMemory(text) {
  const name = text.match(/i'?m (\w+)/i);
  if (name) memory.name = name[1];

  const words = text.toLowerCase().split(" ");
  for (const w of words) {
    if (w.length > 4 && !memory.topics.includes(w)) {
      memory.topics.push(w);
    }
  }

  memory.topics = memory.topics.slice(-8);
  save();
  renderMemory();
}

function renderMemory() {
  document.getElementById("memory").innerText =
    `Name: ${memory.name || "unknown"}\nTopics: ${memory.topics.slice(-5).join(", ")}`;
}

/* =====================
   PROMPT (PHI-3)
===================== */
function buildPrompt(userMsg) {
  let system =
`You are ArasBot, a smart helpful AI. Be concise.`;

  if (memory.name) system += ` User name: ${memory.name}.`;

  let p = `<|system|>\n${system}\n<|end|>\n`;

  for (const h of history.slice(-6)) {
    p += `<|user|>\n${h.user}\n<|end|>\n<|assistant|>\n${h.bot}\n<|end|>\n`;
  }

  p += `<|user|>\n${userMsg}\n<|end|>\n<|assistant|>\n`;

  return p;
}

/* =====================
   CLEAN
===================== */
function clean(text, prompt) {
  text = text.replace(prompt, "");
  text = text.split("<|end|>")[0];
  return text.trim() || "I didn't understand that.";
}

/* =====================
   UI
===================== */
function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function typing(on) {
  let el = document.getElementById("typing");
  if (on && !el) {
    el = document.createElement("div");
    el.id = "typing";
    el.className = "typing";
    el.innerHTML = "<div class='dot'></div><div class='dot'></div><div class='dot'></div>";
    messages.appendChild(el);
  } else if (!on && el) el.remove();
}

/* =====================
   BOOT MODEL
===================== */
window.boot = async function () {
  document.getElementById("status").innerText = "Loading...";

  ai = await pipeline(
    "text-generation",
    "Xenova/phi-3-mini-4k-instruct"
  );

  document.getElementById("status").innerText = "Online";
  document.getElementById("statusText").innerText = "Phi-3 ready";

  addMsg("Model loaded successfully.", "bot");
};

/* =====================
   SEND
===================== */
window.send = async function () {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || busy) return;

  if (!ai) {
    addMsg("Load model first.", "bot");
    return;
  }

  busy = true;
  input.value = "";

  addMsg(text, "user");

  updateMemory(text);
  typing(true);

  const prompt = buildPrompt(text);

  const result = await ai(prompt, {
    max_new_tokens: 140,
    temperature: 0.5,
    top_p: 0.9
  });

  typing(false);

  const output = clean(result[0].generated_text, prompt);

  addMsg(output, "bot");

  history.push({ user: text, bot: output });
  save();

  busy = false;
};

/* =====================
   CLEAR
===================== */
window.clearChat = function () {
  messages.innerHTML = "";
  history = [];
  save();
};
</script>

</body>
</html>
