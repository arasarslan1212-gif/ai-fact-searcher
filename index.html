<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Fact Searcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #888;
      margin-bottom: 1.5rem;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #f0f0f0;
      outline: none;
    }

    input:focus { border-color: #555; }

    button {
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #f0f0f0;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #2e2e2e; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .chips span { font-size: 12px; color: #666; }

    .chip {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #333;
      background: #1a1a1a;
      cursor: pointer;
    }

    .chip:hover { background: #262626; }

    .result {
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #888;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #444;
      border-top-color: #aaa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .answer {
      font-size: 14px;
      line-height: 1.7;
      color: #ddd;
      white-space: pre-wrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-ok  { background: #4ade80; }
    .dot-err { background: #f87171; }
    .dot-warn { background: #facc15; }
  </style>
</head>
<body>
<div class="container">
  <h1>🔍 AI Fact Searcher</h1>
  <p class="subtitle">Searches the internet to answer your questions in real time</p>

  <div class="search-row">
    <input type="text" id="query" placeholder="Ask anything, e.g. What is the population of Tokyo?" />
    <button id="searchBtn" onclick="search()">Search</button>
  </div>

  <div class="chips">
    <span>Try:</span>
    <div class="chip" onclick="setQuery('What is the current Bitcoin price?')">Bitcoin price</div>
    <div class="chip" onclick="setQuery('Who won the 2024 US presidential election?')">2024 election</div>
    <div class="chip" onclick="setQuery('What is the speed of light?')">Speed of light</div>
    <div class="chip" onclick="setQuery('Latest AI news today')">AI news</div>
  </div>

  <div class="result" id="result">
    <div class="status" id="status">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Searching the web…</span>
    </div>
    <p class="answer" id="answer"></p>
  </div>
</div>

<script>
  const API_KEY = "YOUR_ANTHROPIC_API_KEY"; // 🔑 Replace this with your key

  function setQuery(text) {
    document.getElementById("query").value = text;
    document.getElementById("query").focus();
  }

  document.getElementById("query").addEventListener("keydown", e => {
    if (e.key === "Enter") search();
  });

  function setStatus(type, text) {
    const spinner = document.getElementById("spinner");
    const statusText = document.getElementById("statusText");

    spinner.style.display = "none";
    spinner.outerHTML; // force reflow

    let dot = document.getElementById("statusDot");
    if (!dot) {
      dot = document.createElement("div");
      dot.id = "statusDot";
      dot.className = "dot";
      document.getElementById("status").prepend(dot);
    }

    dot.className = "dot " + (type === "ok" ? "dot-ok" : type === "err" ? "dot-err" : "dot-warn");
    statusText.textContent = text;
  }

  async function search() {
    const query = document.getElementById("query").value.trim();
    if (!query) return;

    const resultEl = document.getElementById("result");
    const answerEl = document.getElementById("answer");
    const statusText = document.getElementById("statusText");
    const btn = document.getElementById("searchBtn");

    // Reset UI
    resultEl.style.display = "block";
    answerEl.textContent = "";
    statusText.textContent = "Searching the web…";

    let spinner = document.getElementById("spinner");
    if (!spinner) {
      spinner = document.createElement("div");
      spinner.id = "spinner";
      spinner.className = "spinner";
      document.getElementById("status").prepend(spinner);
    }
    spinner.style.display = "block";

    const dot = document.getElementById("statusDot");
    if (dot) dot.remove();

    btn.disabled = true;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": API_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-beta": "interleaved-thinking-2025-05-14"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: `You are a concise fact-finding AI. When given a question:
1. Use the web_search tool to find current, accurate information.
2. Provide a clear, factual answer in 2-5 sentences.
3. If numbers or statistics are involved, be specific.
4. Mention the source or date of information when relevant.
Be direct and informative. No preamble. Just the facts.`,
          tools: [{ type: "web_search_20250305", name: "web_search" }],
          messages: [{ role: "user", content: query }]
        })
      });

      const data = await response.json();

      if (data.error) throw new Error(data.error.message);

      const textBlocks = data.content.filter(b => b.type === "text");
      const usedSearch = data.content.some(b => b.type === "tool_use" && b.name === "web_search");

      if (textBlocks.length > 0) {
        setStatus("ok", usedSearch ? "Answer found via web search" : "Answer from knowledge base");
        answerEl.textContent = textBlocks.map(b => b.text).join("\n\n");
      } else {
        setStatus("warn", "No answer found");
        answerEl.textContent = "Could not find an answer. Try rephrasing your question.";
      }

    } catch (err) {
      setStatus("err", "Error: " + err.message);
      answerEl.textContent = "Something went wrong. Check your API key and try again.";
    }

    btn.disabled = false;
  }
</script>
</body>
