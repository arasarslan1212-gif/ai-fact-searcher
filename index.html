<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Fact Searcher</title>

<style>
body {
  font-family: sans-serif;
  background: #0f0f0f;
  color: #f0f0f0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 650px;
}

.search-row {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #1a1a1a;
  color: white;
}

button {
  padding: 12px 18px;
  border-radius: 8px;
  background: #222;
  color: white;
  border: 1px solid #444;
  cursor: pointer;
}

.result {
  display: none;
  margin-top: 20px;
  padding: 16px;
  background: #1a1a1a;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🔍 AI Fact Searcher</h1>

  <div class="search-row">
    <input id="query" placeholder="Ask anything..." />
    <button onclick="search()">Search</button>
  </div>

  <div class="result" id="result">
    <p id="statusText"></p>
    <p id="answer"></p>
  </div>
</div>

<script>
async function search() {
  const query = document.getElementById("query").value.trim();
  if (!query) return;

  const result = document.getElementById("result");
  const status = document.getElementById("statusText");
  const answer = document.getElementById("answer");

  result.style.display = "block";
  status.textContent = "Searching...";
  answer.textContent = "";

  try {
    // DuckDuckGo
    const res = await fetch(
      `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`
    );

    const data = await res.json();

    if (data.AbstractText) {
      status.textContent = "From DuckDuckGo";
      answer.textContent = data.AbstractText;
      return;
    }

    // Wikipedia fallback
    const wikiRes = await fetch(
      `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`
    );

    const wikiData = await wikiRes.json();

    if (wikiData.extract) {
      status.textContent = "From Wikipedia";
      answer.textContent = wikiData.extract;
    } else {
      status.textContent = "No result";
      answer.textContent = "Try something else.";
    }

  } catch (err) {
    status.textContent = "Error";
    answer.textContent = err.message;
  }
}
</script>

</body>
</html>
